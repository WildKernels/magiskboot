name: magiskboot

on:
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      magisk_ref:
        description: 'Magisk branch/tag/SHA to build (default: master)'
        required: false
        default: 'master'

jobs:
  android:
    name: Android (NDK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream Magisk
        env:
          MAGISK_REF: ${{ inputs.magisk_ref || 'master' }}
        shell: bash
        run: |
          if ! git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$MAGISK_REF" https://github.com/topjohnwu/Magisk.git upstream; then
            git clone https://github.com/topjohnwu/Magisk.git upstream
            git -C upstream checkout "$MAGISK_REF"
            git -C upstream submodule update --init --recursive --depth 1
          else
            git -C upstream submodule update --init --recursive --depth 1 || true
          fi
          echo "MAGISK_SHA=$(git -C upstream rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "Upstream: $(git -C upstream log -1 --oneline)"

      # Reuse upstream's maintained setup (NDK r30.1 + Rust + sccache) - minimal repair
      - name: Setup Magisk toolchain
        uses: ./upstream/.github/actions/setup

      - name: Build magiskboot (Android ABIs)
        shell: bash
        run: |
          cd upstream && python3 build.py -vr native magiskboot
          ls -lh native/out/*/magiskboot
          file native/out/*/magiskboot

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          for f in upstream/native/out/*/magiskboot; do cp -v "$f" "out/magiskboot-$(basename $(dirname $f))"; done
          ls -lh out/ && file out/*

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-arm64-v8a-${{ env.MAGISK_SHA }}
          path: out/magiskboot-arm64-v8a
      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-armeabi-v7a-${{ env.MAGISK_SHA }}
          path: out/magiskboot-armeabi-v7a
      - name: Upload x86
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-x86-${{ env.MAGISK_SHA }}
          path: out/magiskboot-x86
      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-x86_64-${{ env.MAGISK_SHA }}
          path: out/magiskboot-x86_64

  host:
    name: Host ${{ matrix.os }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: magiskboot
            artifact: magiskboot-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            bin: magiskboot
            artifact: magiskboot-macos-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bin: magiskboot.exe
            artifact: magiskboot-windows-x86_64
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream Magisk
        env:
          MAGISK_REF: ${{ inputs.magisk_ref || 'master' }}
        shell: bash
        run: |
          if ! git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$MAGISK_REF" https://github.com/topjohnwu/Magisk.git upstream; then
            git clone https://github.com/topjohnwu/Magisk.git upstream
            git -C upstream checkout "$MAGISK_REF"
            git -C upstream submodule update --init --recursive --depth 1
          else
            git -C upstream submodule update --init --recursive --depth 1 || true
          fi
          echo "MAGISK_SHA=$(git -C upstream rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build host magiskboot
        shell: bash
        run: |
          # Host build is experimental - cargo only, no NDK
          # Uses upstream's Rust crate directly; may need nix->windows stubs for Windows
          cd upstream/native/src
          cargo build -p magiskboot --release --target ${{ matrix.target }} -v || \
            cargo build -p magiskboot --target ${{ matrix.target }} -v
          ls -lh target/${{ matrix.target }}/release/${{ matrix.bin }}* 2>/dev/null || ls -lh target/${{ matrix.target }}/debug/${{ matrix.bin }}* 2>/dev/null || echo "host binary not produced (expected for Windows until nix ported)"
          mkdir -p $GITHUB_WORKSPACE/out-host
          cp -v target/${{ matrix.target }}/release/${{ matrix.bin }} $GITHUB_WORKSPACE/out-host/${{ matrix.artifact }} 2>/dev/null || \
            cp -v target/${{ matrix.target }}/debug/${{ matrix.bin }} $GITHUB_WORKSPACE/out-host/${{ matrix.artifact }} 2>/dev/null || echo "no binary to copy"

      - name: Upload host
        if: hashFiles('out-host/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.MAGISK_SHA }}
          path: out-host/*
          if-no-files-found: warn
