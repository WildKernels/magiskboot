name: magiskboot

on:
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      magisk_ref:
        description: 'Magisk branch/tag/SHA to build (default: master)'
        required: false
        default: 'master'
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options: [release, debug]

jobs:
  build:
    name: Build magiskboot
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Rust (via ONDK toolchain, ensure cache)
        shell: bash
        run: |
          rustc --version || echo "rustc missing, will be provided by ONDK"

      - name: Clone upstream Magisk
        shell: bash
        env:
          MAGISK_REF: ${{ inputs.magisk_ref || 'master' }}
        run: |
          echo "* Cloning https://github.com/topjohnwu/Magisk.git @ $MAGISK_REF"
          if ! git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$MAGISK_REF" https://github.com/topjohnwu/Magisk.git upstream; then
            git clone https://github.com/topjohnwu/Magisk.git upstream
            git -C upstream checkout "$MAGISK_REF"
            git -C upstream submodule update --init --recursive --depth 1
          else
            git -C upstream submodule update --init --recursive --depth 1 || true
          fi
          echo "MAGISK_SHA=$(git -C upstream rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "Upstream: $(git -C upstream log -1 --oneline)"
          ls upstream/native/src/external/ | head -20

      - name: Setup Android SDK / NDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME" || true
          # build.py must run with cwd=upstream (it looks for app/gradle.properties relative to cwd)
          cd upstream && python3 build.py ndk
          ls -la "$ANDROID_HOME/ndk/magisk" | head -20

      - name: Cache sccache / ccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: sccache-${{ runner.os }}-

      - name: Build magiskboot (release)
        if: inputs.build_type != 'debug'
        shell: bash
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: |
          # use sccache if available
          which sccache && sccache --start-server || true
          cd upstream && python3 build.py -vr native magiskboot
          sccache -s || true
          ls -lh native/out/*/magiskboot

      - name: Build magiskboot (debug)
        if: inputs.build_type == 'debug'
        shell: bash
        env:
          SCCACHE_DIR: ${{ github.workspace }}/.sccache
        run: |
          which sccache && sccache --start-server || true
          cd upstream && python3 build.py -v native magiskboot
          sccache -s || true
          ls -lh native/out/*/magiskboot

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          for f in upstream/native/out/*/magiskboot; do
            abi=$(basename "$(dirname "$f")")
            cp -v "$f" "out/magiskboot-$abi"
          done
          ls -lh out/
          file out/*

      - name: Upload magiskboot arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-arm64-v8a-${{ env.MAGISK_SHA }}
          path: out/magiskboot-arm64-v8a
          if-no-files-found: error

      - name: Upload magiskboot armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-armeabi-v7a-${{ env.MAGISK_SHA }}
          path: out/magiskboot-armeabi-v7a
          if-no-files-found: error

      - name: Upload magiskboot x86
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-x86-${{ env.MAGISK_SHA }}
          path: out/magiskboot-x86
          if-no-files-found: error

      - name: Upload magiskboot x86_64
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-x86_64-${{ env.MAGISK_SHA }}
          path: out/magiskboot-x86_64
          if-no-files-found: error

