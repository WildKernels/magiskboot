name: magiskboot

on:
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      magisk_ref:
        description: 'Magisk branch/tag/SHA to build (default: master)'
        required: false
        default: 'master'

permissions:
  contents: write

jobs:
  android:
    name: Android (NDK)
    runs-on: ubuntu-24.04
    outputs:
      magisk_sha: ${{ steps.clone.outputs.magisk_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Clone upstream Magisk
        id: clone
        env:
          MAGISK_REF: ${{ inputs.magisk_ref || 'master' }}
        shell: bash
        run: |
          if ! git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$MAGISK_REF" https://github.com/topjohnwu/Magisk.git upstream; then
            git clone https://github.com/topjohnwu/Magisk.git upstream
            git -C upstream checkout "$MAGISK_REF"
            git -C upstream submodule update --init --recursive --depth 1
          else
            git -C upstream submodule update --init --recursive --depth 1 || true
          fi
          SHA=$(git -C upstream rev-parse --short HEAD)
          echo "magisk_sha=$SHA" >> $GITHUB_OUTPUT
          echo "MAGISK_SHA=$SHA" >> $GITHUB_ENV
          echo "Upstream: $(git -C upstream log -1 --oneline)"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Rust nightly (Magisk needs nightly for panic-immediate-abort)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Setup Android SDK / NDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          cd upstream && python3 build.py ndk
          ls -la "$ANDROID_HOME/ndk/magisk" | head -20

      - name: Build magiskboot (Android ABIs)
        shell: bash
        run: |
          cd upstream && python3 build.py -vr native magiskboot
          ls -lh native/out/*/magiskboot
          file native/out/*/magiskboot

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          for f in upstream/native/out/*/magiskboot; do cp -v "$f" "out/magiskboot-$(basename $(dirname $f))"; done
          ls -lh out/ && file out/*

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-arm64-v8a-${{ steps.clone.outputs.magisk_sha }}
          path: out/magiskboot-arm64-v8a
      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-armeabi-v7a-${{ steps.clone.outputs.magisk_sha }}
          path: out/magiskboot-armeabi-v7a
      - name: Upload x86
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-x86-${{ steps.clone.outputs.magisk_sha }}
          path: out/magiskboot-x86
      - name: Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: magiskboot-x86_64-${{ steps.clone.outputs.magisk_sha }}
          path: out/magiskboot-x86_64

  host:
    name: Host ${{ matrix.os }} ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: magiskboot
            artifact: magiskboot-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            bin: magiskboot
            artifact: magiskboot-macos-arm64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            bin: magiskboot.exe
            artifact: magiskboot-windows-x86_64
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Clone upstream Magisk
        env:
          MAGISK_REF: ${{ inputs.magisk_ref || 'master' }}
        shell: bash
        run: |
          if ! git clone --depth 1 --recurse-submodules --shallow-submodules --branch "$MAGISK_REF" https://github.com/topjohnwu/Magisk.git upstream; then
            git clone https://github.com/topjohnwu/Magisk.git upstream
            git -C upstream checkout "$MAGISK_REF"
            git -C upstream submodule update --init --recursive --depth 1
          else
            git -C upstream submodule update --init --recursive --depth 1 || true
          fi
          echo "MAGISK_SHA=$(git -C upstream rev-parse --short HEAD)" >> $GITHUB_ENV
      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - name: Build host magiskboot
        shell: bash
        run: |
          cd upstream/native/src
          cargo build -p magiskboot --release --target ${{ matrix.target }} -v || cargo build -p magiskboot --target ${{ matrix.target }} -v
          ls -lh target/${{ matrix.target }}/release/${{ matrix.bin }}* 2>/dev/null || ls -lh target/${{ matrix.target }}/debug/${{ matrix.bin }}* 2>/dev/null || echo "host binary not produced (expected for Windows until nix ported)"
          mkdir -p $GITHUB_WORKSPACE/out-host
          cp -v target/${{ matrix.target }}/release/${{ matrix.bin }} $GITHUB_WORKSPACE/out-host/${{ matrix.artifact }} 2>/dev/null || cp -v target/${{ matrix.target }}/debug/${{ matrix.bin }} $GITHUB_WORKSPACE/out-host/${{ matrix.artifact }} 2>/dev/null || echo "no binary to copy"
      - name: Upload host
        if: hashFiles('out-host/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ env.MAGISK_SHA }}
          path: out-host/*
          if-no-files-found: warn

  release:
    name: Release nightly (single)
    needs: android
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: magiskboot-*
          merge-multiple: true
      - name: List artifacts
        shell: bash
        run: ls -R dist 2>&1 | head -100; ls -lh dist/ 2>&1 | head -20
      - name: Create/Update nightly release (single release, hash in notes)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAGISK_SHA: ${{ needs.android.outputs.magisk_sha }}
        shell: bash
        run: |
          set -e
          echo "Magisk SHA: $MAGISK_SHA"
          if gh release view nightly >/dev/null 2>&1; then
            echo "Deleting previous nightly release..."
            gh release delete nightly --yes --cleanup-tag || gh release delete nightly --yes || true
          fi
          git tag -d nightly 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true
          ls -lh dist/
          gh release create nightly \
            --title "nightly $MAGISK_SHA" \
            --notes "Automated nightly build of magiskboot from topjohnwu/Magisk @ $MAGISK_SHA

          Built Android ABIs: arm64-v8a, armeabi-v7a, x86, x86_64 (static ELF)
          Host artifacts (if built): linux-x86_64, macos-arm64, windows-x86_64.exe (best-effort)

          Upstream: https://github.com/topjohnwu/Magisk/commit/$MAGISK_SHA" \
            --target main \
            --prerelease \
            dist/*
          echo "Created release nightly -> $MAGISK_SHA"
          gh release view nightly --json tagName,name,url --jq '{tag, name, url}'
